name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        shell: bash
        run: |
          ./linux.sh all
          mkdir -p dist
          mv main.amd64.bin main.arm64.bin main.amd64.exe main.arm64.exe main.mac.arm64.bin dist/

          test -f dist/main.amd64.bin
          test -f dist/main.arm64.bin
          test -f dist/main.amd64.exe
          test -f dist/main.arm64.exe
          test -f dist/main.mac.arm64.bin

          (
            cd dist
            sha256sum main.amd64.bin main.arm64.bin main.amd64.exe main.arm64.exe main.mac.arm64.bin > SHA256SUMS
          )

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "$GITHUB_REF_NAME"
            dist/*
            --verify-tag
            --generate-notes
            --title "$GITHUB_REF_NAME"
          )

          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

  docker:
    name: Publish Docker Hub image
    if: vars.DOCKERHUB_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'opennamu/opennamu' }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
